<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Billing Application</h1>

        <div class="customer-info">
            <label for="customer-name">Customer Name</label>
            <input type="text" id="customer-name" placeholder="Enter customer name">
            <label for="invoice-date">Date</label>
            <input type="date" id="invoice-date">
        </div>

        <div class="input-group">
            <label for="item-name">Item Name</label>
            <input type="text" id="item-name" placeholder="Enter item name">
            <label for="item-price">Item Price</label>
            <input type="number" id="item-price" placeholder="Enter price">
            <label for="item-quantity">Quantity</label>
            <input type="number" id="item-quantity" placeholder="Enter quantity">
            <label for="item-gst">GST (%)</label>
            <input type="number" id="item-gst" placeholder="Enter GST percentage">
            <button id="add-item-btn">Add Item</button>
        </div>

        <table id="invoice-table">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>GST (%)</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <div class="total">
            <h3>Total Amount: ₹<span id="total-amount">0.00</span></h3>
        </div>

        <div class="action-buttons">
            <button id="calculate-btn">Calculate Total</button>
            <button id="invoice-btn">Generate Invoice</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
